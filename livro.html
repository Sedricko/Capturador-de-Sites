<!doctype html>
<html lang="pt-br">
<meta charset="utf-8">
<title>Livro do site</title>
<style>
	body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; color: #1d2230; background: #fff; }
	.capa { height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
	.capa h1 { font-size: 34px; margin: 0 0 8px; }
	.capa p { color: #6b7185; margin: 4px 0; }
	.sumario { break-before: page; padding: 0 24px; }
	.sumario ol { columns: 2; column-gap: 32px; padding-left: 22px; }
	.sumario li { break-inside: avoid; margin: 2px 0; }
	.sumario a { color: #4f46e5; text-decoration: none; }
	section.pagina { break-before: page; }
	section.pagina > h2 { font-size: 13px; color: #6b7185; border-bottom: 1px solid #e2e4ec; margin: 0 0 12px; padding: 0 24px 6px; }
</style>
<div class="capa"><h1 id="nome"></h1><p id="info"></p><p>Cópia offline gerada pelo Capturador de Sites</p></div>
<nav class="sumario"><h2>Sumário</h2><ol id="sumario"></ol></nav>
<main id="paginas"></main>
<script type="module" src="livro.js"></script>
</html>
